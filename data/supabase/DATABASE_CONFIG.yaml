model_status:
  overall: active
  last_reviewed: 2026-08-21
  approved_by: "admin"
  notes: "Flujo SMS/phone de registro eliminado (solo email). Migración 013 (20260808000001): RPC hard_delete_member para borrado físico de perfiles por admin (evita auto-eliminación y borrar el último admin; limpia cuenta auth y cascades). Migración 013 aplicada 2026-08-08 en dev y producción. Producción (proyecto xlawavqe... ref xlawavqe) no usa historial schema_migrations: se aplicó el RPC vía SQL directo y se recargó caché PostgREST (NOTIFY pgrst 'reload schema'). Dev (proyecto jaltwjci...) sí usa el historial y el push quedó aplicado. Pendiente de dashboard: la configuración de auth (Site/Redirect URLs con dominio Vercel, enable email confirmations, SMTP custom) se debe revisar en producción. Migración 20260821000001 (SPEC_001, TKT-OMEGYM-019, 2026-08-21): rutinas personales compartibles por código — training_plans.kind ('trainer'|'personal', DEFAULT trainer retrocompatible), share_code + índice único parcial, RLS CRUD personal para miembros (traducción auth_user_id) y RPCs SECURITY DEFINER generate_share_code/revoke_share_code/import_routine_by_code. Aplicada SOLO en DEV vía db push; PENDIENTE en producción hasta cerrar TKT-OMEGYM-022. Migración 20260821120000 (TKT-OMEGYM-024, 2026-08-21): training_plans.show_in_plan BOOLEAN NOT NULL DEFAULT true — visibilidad de rutinas personales en Mi plan; aplicada SOLO en DEV. Migración 20260821130000 (TKT-OMEGYM-025, 2026-08-21): plan_assignments.visible BOOLEAN NOT NULL DEFAULT true (preferencia por miembro) + RPC SECURITY DEFINER set_assignment_visibility con fallback legacy vía show_in_plan; aplicada SOLO en DEV. Migración 20260821140000 (FIX TKT-OMEGYM-025, 2026-08-21): set_assignment_visibility corregido — usaba auth.uid() directo y fallaba en cuentas vinculadas (profiles.id ≠ auth.uid()); ahora traduce vía profiles.auth_user_id con control FOUND y search_path=''; aplicada SOLO en DEV. APLICACIÓN A PRODUCCIÓN (ref xlawavqceyprraeyrmtm, 2026-08-21): las 4 migraciones de la sesión (SPEC_001/019, 120000/024, 130000/025 y FIX 140000) se aplicaron vía SQL directo por Management API con token nuevo, en orden cronológico; PostgREST recargado (NOTIFY pgrst). Verificado: 4 columnas (kind, share_code, show_in_plan, visible), 4 RPCs + grants a authenticated, 6 políticas RLS personales (training_plans y plan_exercises). Producción al día con DEV en este alcance; validación funcional E2E sigue pendiente (TKT-OMEGYM-022)."

